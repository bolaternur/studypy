    <!--
      The Pyodide runtime is NOT loaded here.

      It used to sit in <head> as a render-blocking script, so every visitor
      downloaded the Python runtime loader before the landing page could paint —
      including the majority who never open the editor. `CodeEditor` injects it
      on demand, once, with proper load and error handling.
    -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <script>
      // Some third-party runtimes try to replace window.fetch, which throws in
      // browsers where the property is a getter. Make the assignment a no-op
      // instead of letting it break the page.
      try {
        const originalFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (value) => {
            console.warn('Blocked an attempt to overwrite window.fetch:', value);
          },
        });
      } catch (error) {
        console.error('Could not guard window.fetch:', error);
      }
    </script>
